<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!--
      테마 「잉크」의 두 폰트. **안 떠도 앱은 그대로 돈다** — `--font-body`/`--font-display`의
      폴백이 옛 스택 그대로라, 미니앱 CSP가 막으면 예전 글꼴로 조용히 내려앉을 뿐이다.
      링크를 `index.css`의 `@import`가 아니라 여기 두는 이유: 빌드가 손대지 않아 실패 경로가 눈에 보인다.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <!-- ⚠️ `600;800`이 아니라 **범위(`600..800`)** 다. 앞엣것은 정적 인스턴스 둘만 받아 와서
         `ui.h2`가 쓰는 700이 합성(가짜 볼드)으로 그려진다 — 명조의 획 대비가 뭉개진다. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600..800&display=swap" />
    <title>홈트가어렵나</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
